<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>chaos chaos</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:sans-serif;
}

body{
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

#container{
    width:min(700px, 90vw);
}

h1{
    text-align:center;
    margin-bottom:24px;
    font-size:42px;
}

#searchRow{
    display:flex;
    gap:10px;
}

#urlInput{
    flex:1;
    padding:16px;
    border:none;
    border-radius:12px;
    background:#222;
    color:white;
    font-size:16px;
}

button{
    padding:16px 20px;
    border:none;
    border-radius:12px;
    background:#333;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#444;
}

#bookmarks{
    margin-top:28px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:12px;
}

.bookmark{
    background:#1d1d1d;
    border:1px solid #333;
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:0.15s;
}

.bookmark:hover{
    transform:translateY(-2px);
    background:#2a2a2a;
}

.bookmarkTitle{
    font-size:18px;
    margin-bottom:6px;
}

.bookmarkURL{
    font-size:12px;
    opacity:0.7;
    word-break:break-all;
}

#addRow{
    margin-top:16px;
    display:flex;
    gap:10px;
}

.smallInput{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
}
</style>
</head>

<body>

<div id="container">

    <h1>i can do anything</h1>

    <div id="searchRow">
        <input
            id="urlInput"
            placeholder="url"
        >

        <button id="goBtn">
            go
        </button>
    </div>

    <div id="addRow">
        <input
            id="bookmarkName"
            class="smallInput"
            placeholder="bookmark name"
        >

        <input
            id="bookmarkURL"
            class="smallInput"
            placeholder="bookmark URL"
        >

        <button id="addBookmarkBtn">
            +
        </button>
    </div>

    <div id="bookmarks"></div>

</div>

<script>
const urlInput =
    document.getElementById("urlInput");

const goBtn =
    document.getElementById("goBtn");

const bookmarksDiv =
    document.getElementById("bookmarks");

const bookmarkName =
    document.getElementById("bookmarkName");

const bookmarkURL =
    document.getElementById("bookmarkURL");

const addBookmarkBtn =
    document.getElementById("addBookmarkBtn");

let bookmarks =
    JSON.parse(
        localStorage.getItem("bookmarks")
    ) || [

        {
            name: "Google",
            url: "https://google.com"
        },

        {
            name: "YouTube",
            url: "https://youtube.com"
        },

        {
            name: "GitHub",
            url: "https://github.com"
        }

    ];

function fixURL(url){

    url = url.trim();

    if (
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){
        url = "https://" + url;
    }

    return url;
}

function openURL(url){

    window.location.href = fixURL(url);
}

function renderBookmarks(){

    bookmarksDiv.innerHTML = "";

    bookmarks.forEach(bookmark => {

        const div =
            document.createElement("div");

        div.className = "bookmark";

        div.innerHTML = `
            <div class="bookmarkTitle">
                ${bookmark.name}
            </div>

            <div class="bookmarkURL">
                ${bookmark.url}
            </div>
        `;

        div.onclick = () => {
            openURL(bookmark.url);
        };

        bookmarksDiv.appendChild(div);
    });

    localStorage.setItem(
        "bookmarks",
        JSON.stringify(bookmarks)
    );
}

goBtn.onclick = () => {

    if (!urlInput.value.trim()) return;

    openURL(urlInput.value);
};

urlInput.addEventListener("keydown", e => {

    if (e.key === "Enter") {
        openURL(urlInput.value);
    }
});

addBookmarkBtn.onclick = () => {

    const name =
        bookmarkName.value.trim();

    const url =
        bookmarkURL.value.trim();

    if (!name || !url) return;

    bookmarks.push({
        name,
        url: fixURL(url)
    });

    bookmarkName.value = "";
    bookmarkURL.value = "";

    renderBookmarks();
};

renderBookmarks();
</script>

</body>
</html>
